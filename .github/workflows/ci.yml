name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The server projects only: the iPhone/iPad app needs the MAUI workload and Xcode (see the ios job).
      - run: dotnet build src/PhotoWorld.Web --configuration Release
      - run: dotnet build tests/PhotoWorld.Api.Tests --configuration Release
      - run: dotnet test tests/PhotoWorld.Api.Tests --configuration Release --no-build

  # Builds the iPhone/iPad app for the iOS Simulator (no signing needed). macOS runners come with Xcode.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-ios
      - run: dotnet build src/PhotoWorld.App --configuration Release -f net10.0-ios -r iossimulator-arm64

  # Applies EF migrations to Supabase. Runs only for main, after a green build; a no-op when nothing is pending.
  migrate:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: supabase-migrations
    env:
      ConnectionStrings__PhotoWorld: ${{ secrets.SUPABASE_DB_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check secret
        run: |
          if [ -z "$ConnectionStrings__PhotoWorld" ]; then
            echo "::error::Set the SUPABASE_DB_CONNECTION_STRING repository secret (Session pooler connection string)."
            exit 1
          fi
      - run: dotnet tool restore
      - run: dotnet ef database update --project src/PhotoWorld.Api
