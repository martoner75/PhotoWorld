name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The SDK pinned in global.json: "10.0.x" picks up new releases before their downloads are everywhere.
          global-json-file: global.json
      # The server projects only: the iPhone/iPad app needs the MAUI workload and Xcode (see the ios job).
      - run: dotnet build src/PhotoWorld.Web --configuration Release
      - run: dotnet build tests/PhotoWorld.Api.Tests --configuration Release
      # xunit v3 runs on Microsoft.Testing.Platform, opted into in global.json; that mode takes --project.
      - run: dotnet test --project tests/PhotoWorld.Api.Tests --configuration Release --no-build

  # Builds the iPhone/iPad app for the iOS Simulator (no signing needed). macOS runners come with Xcode.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The SDK pinned in global.json: "10.0.x" picks up new releases before their downloads are everywhere.
          global-json-file: global.json
      - run: dotnet workload install maui-ios
      # The runner has Android tools too; skip that target here (it has its own job).
      - run: dotnet build src/PhotoWorld.App --configuration Release -f net10.0-ios -r iossimulator-arm64 -p:EnableAndroid=false

  # Builds the Android app in Release on Linux, where the Android SDK is preinstalled.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The SDK pinned in global.json: "10.0.x" picks up new releases before their downloads are everywhere.
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 21
      - run: dotnet workload install maui-android
      - run: dotnet build src/PhotoWorld.App -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory=$ANDROID_HOME -p:AcceptAndroidSDKLicenses=True
      - run: dotnet build src/PhotoWorld.App --configuration Release -f net10.0-android

  # Applies EF migrations to Supabase. Runs only for main, after a green build; a no-op when nothing is pending.
  migrate:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: supabase-migrations
    env:
      ConnectionStrings__PhotoWorld: ${{ secrets.SUPABASE_DB_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The SDK pinned in global.json: "10.0.x" picks up new releases before their downloads are everywhere.
          global-json-file: global.json
      - name: Check secret
        run: |
          if [ -z "$ConnectionStrings__PhotoWorld" ]; then
            echo "::error::Set the SUPABASE_DB_CONNECTION_STRING repository secret (Session pooler connection string)."
            exit 1
          fi
      - run: dotnet tool restore
      # dotnet ef reads the project's metadata before it builds, which needs its packages restored first.
      - run: dotnet restore src/PhotoWorld.Api
      - run: dotnet ef database update --project src/PhotoWorld.Api
